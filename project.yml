name: iPod
options:
  bundleIdPrefix: com.local.ipod
  deploymentTarget:
    iOS: "12.0"
targets:
  iPod:
    type: application
    platform: iOS
    deploymentTarget: "12.0"
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.local.ipod
        INFOPLIST_KEY_CFBundleDisplayName: iPod
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: "YES"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: iPod
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        UIBackgroundModes:
          - audio
        NSAppleMusicUsageDescription: "iPod membutuhkan akses ke pustaka musik untuk menampilkan dan memutar lagu."
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        CFBundleIcons:
          CFBundlePrimaryIcon:
            CFBundleIconFiles:
              - AppIcon
            UIPrerenderedIcon: true
          CFBundleAlternateIcons:
            AppIconLight:
              CFBundleIconFiles:
                - AppIconLight
              UIPrerenderedIcon: true